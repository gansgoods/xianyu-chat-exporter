<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      max-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #333;
    }
    .header {
      background: linear-gradient(135deg, #FFE14D, #FFC107);
      color: #333;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-icon { font-size: 18px; }
    .toolbar {
      padding: 10px 16px;
      background: #fafafa;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .toolbar label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .toolbar input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #FFB800;
    }
    .status {
      margin-left: auto;
      color: #999;
      font-size: 12px;
    }
    .message-list {
      max-height: 320px;
      overflow-y: auto;
      padding: 8px 0;
    }
    .message-item {
      display: flex;
      align-items: flex-start;
      padding: 8px 16px;
      gap: 10px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.15s;
    }
    .message-item:hover {
      background: #fafafa;
    }
    .message-item input[type="checkbox"] {
      margin-top: 4px;
      width: 16px;
      height: 16px;
      accent-color: #FFB800;
      flex-shrink: 0;
    }
    .message-content {
      flex: 1;
      min-width: 0;
    }
    .message-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .message-sender {
      font-weight: 500;
      color: #333;
    }
    .message-sender.me {
      color: #FFB800;
    }
    .message-time {
      font-size: 11px;
      color: #999;
    }
    .message-text {
      color: #666;
      word-break: break-word;
      line-height: 1.4;
    }
    .message-text.image {
      color: #1890ff;
    }
    .message-text.video {
      color: #52c41a;
    }
    .footer {
      padding: 12px 16px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #FFE14D, #FFC107);
      color: #333;
    }
    .btn-primary:hover {
      filter: brightness(1.05);
    }
    .btn-secondary {
      background: #f5f5f5;
      color: #666;
    }
    .btn-secondary:hover {
      background: #e8e8e8;
    }
    .empty {
      padding: 40px 20px;
      text-align: center;
      color: #999;
    }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .loading {
      padding: 40px 20px;
      text-align: center;
      color: #999;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #f0f0f0;
      border-top-color: #FFB800;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">💬</span>
    闲鱼聊天记录导出
  </div>
  
  <div id="loading" class="loading">
    <div class="spinner"></div>
    正在读取聊天记录...
  </div>
  
  <div id="empty" class="empty" style="display: none;">
    <div class="empty-icon">🔍</div>
    <div>未找到聊天记录</div>
    <div style="font-size: 12px; margin-top: 8px;">请在闲鱼聊天页面使用此插件</div>
  </div>
  
  <div id="content" style="display: none;">
    <div class="toolbar">
      <label>
        <input type="checkbox" id="selectAll" checked>
        全选
      </label>
      <label style="margin-left: auto; color: #999; font-size: 12px;">
        <input type="checkbox" id="debugMode">
        🔧 调试
      </label>
      <span class="status" id="status">已选择 0 条</span>
    </div>
    
    <div class="message-list" id="messageList"></div>
    
    <div class="footer">
      <button class="btn btn-primary" id="exportHtml">导出 HTML</button>
      <button class="btn btn-secondary" id="exportMd">导出 Markdown</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
